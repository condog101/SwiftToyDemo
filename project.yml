# XcodeGen fallback — you normally do NOT need this file!
#
# The repo already contains a ready-to-open PhysicsPlayground.xcodeproj.
# But if that project ever refuses to open in a future Xcode version,
# you can regenerate a fresh one from this description:
#
#   brew install xcodegen
#   xcodegen generate
#
# (See the Troubleshooting section of README.md.)

name: PhysicsPlayground
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    visionOS: "1.0"
  createIntermediateGroups: true

targets:
  PhysicsPlayground:
    type: application
    platform: visionOS
    sources:
      - PhysicsPlayground
    info:
      path: PhysicsPlayground/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PhysicsPlayground
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS: "xros xrsimulator"
        TARGETED_DEVICE_FAMILY: 7
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
